name: Build Windows package
on:
  push:
    branches: [main, "ccr-*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install . pyinstaller pytest
      - run: python -m pytest -q tests
      - run: pyinstaller --onefile --name Pawload --collect-all yt_dlp src/pawload/cli.py
      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName dist/ffmpeg.exe
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory Pawload-Windows
          Copy-Item dist/Pawload.exe, dist/ffmpeg.exe, README.md, LICENSE Pawload-Windows/
          Copy-Item extension Pawload-Windows/extension -Recurse
      - uses: actions/upload-artifact@v4
        with: { name: Pawload-Windows, path: Pawload-Windows }
