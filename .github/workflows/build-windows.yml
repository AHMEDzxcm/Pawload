name: Build Windows installer
on:
  push:
    branches: [main, "ccr-*"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install . pyinstaller pytest
      - run: python -m pytest -q tests
      - name: Build Palwoad.exe (tray app) and palwoad-host.exe (browser pairing helper)
        run: |
          pyinstaller --onefile --windowed --name Palwoad --paths src --collect-all yt_dlp --collect-all pystray packaging/launcher.py
          pyinstaller --onefile --name palwoad-host --paths src packaging/host.py
      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          $urls = @("https://github.com/GyanD/codexffmpeg/releases/download/8.0/ffmpeg-8.0-essentials_build.zip",
                    "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
                    "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip")
          $ok = $false
          foreach ($u in $urls) {
            for ($i = 0; $i -lt 3 -and -not $ok; $i++) {
              try { Invoke-WebRequest $u -OutFile ff.zip -TimeoutSec 600; $ok = $true } catch { Write-Host "retry $u : $_"; Start-Sleep 5 }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "could not download ffmpeg" }
          Expand-Archive ff.zip ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName dist/ffmpeg.exe
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\palwoad.iss
      - name: Smoke test the installed layout
        shell: pwsh
        run: |
          Start-Process installer\PalwoadSetup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$PWD\smoke" -Wait
          if (-not (Test-Path smoke\Palwoad.exe)) { throw "install failed" }
          $reg = (Get-ItemProperty "HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.palwoad.host").'(default)'
          Get-Content $reg
          # pairing helper speaks the native-messaging protocol
          $msg = [Text.Encoding]::UTF8.GetBytes('{"type":"hello"}')
          $len = [BitConverter]::GetBytes([uint32]$msg.Length)
          [IO.File]::WriteAllBytes("hello.bin", $len + $msg)
          cmd /c "smoke\palwoad-host.exe < hello.bin > out.bin"
          $out = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes("out.bin"))
          Write-Host ($out -replace '"token": "[^"]*"','"token": "***"')
          if ($out -notmatch '"ok": true') { throw "pairing helper failed" }
          $r = Invoke-RestMethod http://127.0.0.1:9614/api/ping
          if ($r.app -ne "palwoad") { throw "service not running" }
      - uses: actions/upload-artifact@v4
        with: { name: PalwoadSetup, path: installer/PalwoadSetup.exe }
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/PalwoadSetup.exe
          generate_release_notes: true
