[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palwoad"
version = "0.1.0"
description = "Open-source download manager: fast segmented downloads, video/audio grabbing, browser integration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["yt-dlp", "pystray", "Pillow"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
palwoad = "palwoad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
