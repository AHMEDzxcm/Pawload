[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pawload"
version = "0.1.0"
description = "Open-source download manager: fast segmented downloads, video/audio grabbing, browser integration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["yt-dlp"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pawload = "pawload.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
